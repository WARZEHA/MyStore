<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านยาจำลอง · หน้าแรก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --card: #181818;
    --card-hover: #222222;
    --line: #2a2a2a;
    --text: #ffffff;
    --muted: #b3b3b3;
    --accent: #1ed760;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Thai', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; line-height: 1.4; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .notice {
    border-left: 4px solid var(--accent);
    background: var(--card);
    color: var(--muted);
    padding: 12px 16px;
    border-radius: 8px;
    margin: 0 0 24px;
  }
  .notice strong { color: var(--text); }
  nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .btn {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 72px;
    padding: 14px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--card-hover); border-color: var(--accent); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .num {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: #121212;
    font-weight: 700;
  }
  .txt { display: flex; flex-direction: column; min-width: 0; }
  .title { font-size: 18px; font-weight: 700; }
  .desc { color: var(--muted); font-size: 16px; }
  .arrow { margin-left: auto; color: var(--muted); font-size: 22px; }
  footer { color: var(--muted); font-size: 14px; margin-top: 32px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>ร้านยาจำลอง</h1>
  <p class="sub">เลือกหน้าที่ต้องการใช้งาน</p>
  <p class="notice"><strong>ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</strong></p>
  <nav aria-label="เมนูหลัก"><ul id="menu"></ul></nav>
  <footer>Workshop ร้านยาจำลอง</footer>
</main>
<script>
  // รายการลิงก์ เพิ่มหรือลบหน้าได้ด้วยการแก้หนึ่งบรรทัด
  // หน้าที่ยังไม่ได้ push จะขึ้น 404 จนกว่าจะมีไฟล์นั้น (ไม่ต้องซ่อนปุ่ม)
  const LINKS = [
    { href: 'pos.html',       title: 'หน้าขายยา',            desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา' },
    { href: 'admin.html',     title: 'จัดการระบบ (ผู้ดูแล)',  desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล' },
    { href: 'dashboard.html', title: 'Dashboard คลังยา',      desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ' },
    { href: 'status.html',    title: 'ตรวจสถานะระบบ',         desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ' },
  ];

  // สร้างปุ่มด้วย createElement และ textContent (ไม่แทรก HTML จากข้อความ)
  const menu = document.getElementById('menu');
  LINKS.forEach(function (link, i) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'btn';
    a.href = link.href;

    const num = document.createElement('span');
    num.className = 'num';
    num.setAttribute('aria-hidden', 'true');
    num.textContent = String(i + 1);

    const txt = document.createElement('span');
    txt.className = 'txt';
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = link.title;
    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = link.desc;
    txt.append(title, desc);

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '›';

    a.append(num, txt, arrow);
    li.append(a);
    menu.append(li);
  });
</script>
</body>
</html>
